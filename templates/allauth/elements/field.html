{% load allauth %}
<div class="mb-3">
  {% if attrs.type != "checkbox" and attrs.type != "radio" %}<label class="form-label small fw-semibold" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>{% endif %}
  <input class="{% if attrs.type == 'checkbox' or attrs.type == 'radio' %}form-check-input{% else %}form-control{% endif %}{% if attrs.errors %} is-invalid{% endif %}"
         {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %}
         {% if attrs.checked %}checked{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
         {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
         {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}<label class="form-check-label small" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>{% endif %}
  {% if attrs.errors %}<div class="invalid-feedback d-block">{{ attrs.errors }}</div>{% endif %}
  {% if slots.help_text %}<div class="form-text">{% slot help_text %}{% endslot %}</div>{% endif %}
</div>

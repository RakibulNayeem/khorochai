{% load i18n %}<div class="d-flex flex-wrap justify-content-center gap-2">
  <a class="btn btn-brand dev-btn" href="mailto:{{ developer.email }}">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13zm2.6.5 6.4 5 6.4-5H5.6zM19 7.6l-6.4 5a1 1 0 0 1-1.2 0L5 7.6v10.9c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V7.6z"/></svg>
    {% translate "Email" %}</a>
  {% if developer.facebook %}<a class="btn btn-outline-secondary dev-btn" href="{{ developer.facebook }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21h2.9z"/></svg>
    Facebook</a>{% endif %}
  {% if developer.linkedin %}<a class="btn btn-outline-secondary dev-btn" href="{{ developer.linkedin }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.3 8.5h3V19h-3V8.5zM6.8 4a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM10.2 8.5h2.9v1.4h.1c.4-.8 1.4-1.6 2.9-1.6 3.1 0 3.7 2 3.7 4.7V19h-3v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V19h-2.9V8.5z"/></svg>
    LinkedIn</a>{% endif %}
  {% if developer.portfolio %}<a class="btn btn-outline-secondary dev-btn" href="{{ developer.portfolio }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    {% translate "Portfolio" %}</a>{% endif %}
</div>
